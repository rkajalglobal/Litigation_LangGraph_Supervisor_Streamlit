version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ruchi Kajal", email = "rkajalglobal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=0.2,<2",
    "langgraph>=0.2.60,<2",
    "pypdf>=5,<7",
    "pytest>=8,<10",
    "python-docx>=1.1,<2",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
    "streamlit>=1.37,<2",
]

[project.scripts]
litigation-langgraph-supervisor-streamlit = "litigation_langgraph_supervisor_streamlit:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
